<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a0d">
  <title>Descubrimiento de marca</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body class="form">
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <div class="top-in">
      <span class="brand" id="brand"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>

  <main id="stage" class="stage" aria-live="polite"></main>

  <nav class="nav" id="nav" hidden>
    <div class="nav-in">
      <button type="button" class="btn ghost" id="back" aria-label="Pregunta anterior">← Atrás</button>
      <span class="saved" id="saved"></span>
      <div class="nav-r">
        <span class="kbd" id="kbd">Enter ↵</span>
        <button type="button" class="btn primary" id="next">Siguiente</button>
      </div>
    </div>
  </nav>

  <footer class="powered">Powered by NEO</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/form.js"></script>
</body>
</html>
